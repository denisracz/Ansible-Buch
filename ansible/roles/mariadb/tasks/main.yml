---
- name: MariaDB installieren
  ansible.builtin.apt:
    name: mariadb-server
    state: present
    update_cache: true

- name: Dienst starten
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Konfigurieren von bind-address
  ansible.builtin.lineinfile:
    path: /etc/mysql/mariadb.conf.d/50-server.cnf
    regexp: '^\s*bind-address\s*='
    line: "bind-address = 0.0.0.0"
    create: true
    mode: "0644"
  notify: Restart MariaDB

- name: Datenbank erstellen
  ansible.builtin.include_tasks: create_db.yml

- name: Benutzer erstellen
  ansible.builtin.include_tasks: create_user.yml
  tags:
    - db_users
