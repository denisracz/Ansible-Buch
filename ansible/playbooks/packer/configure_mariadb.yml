---
- name: Ubuntu für MariaDB AMI konfigurieren
  hosts: all
  become: yes
  tasks:
    - name: Installiere MariaDB
      ansible.builtin.apt:
        name: mariadb-server
        state: present
        update_cache: yes

    - name: Dienst enablen und starten
      ansible.builtin.service:
        name: mariadb
        state: started
        enabled: yes
