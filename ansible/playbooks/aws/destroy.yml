- name: Destroy AWS infrastructure for MariaDB
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    region: eu-central-1
    key_name: "mariadb-key"
    aws_access_key: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      # Gekürzt
    aws_secret_key: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      # Gekürzt

  tasks:
    - name: Get VPC information
      amazon.aws.ec2_vpc_net_info:
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        filters:
          "tag:Name": mariadb-vpc
      register: vpc_info
      
    - name: Set VPC ID if it exists
      set_fact:
        vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"
      when: vpc_info.vpcs | length > 0

    - name: Get instance information
      amazon.aws.ec2_instance_info:
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        filters:
          "tag:Role": mariadb
          instance-state-name: ["pending", "running", "stopping", "stopped"]
      register: ec2_info
      when: vpc_id is defined
    
    # First terminate EC2 instances and wait for completion
    - name: Terminate EC2 instance
      amazon.aws.ec2_instance:
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        instance_ids: "{{ item.instance_id }}"
        state: absent
        wait: yes
      with_items: "{{ ec2_info.instances | default([]) }}"
      ignore_errors: yes
      when: vpc_id is defined and ec2_info.instances is defined
    
    # Add a delay to ensure instance termination processes complete
    - name: Wait for instance termination to complete
      pause:
        seconds: 30
      when: vpc_id is defined and ec2_info.instances is defined and ec2_info.instances | length > 0

    # Check for any Elastic IPs and release them
    - name: Get elastic IPs
      amazon.aws.ec2_eip_info:
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
      register: eip_info
      when: vpc_id is defined
    
    - name: Release elastic IPs associated with VPC
      amazon.aws.ec2_eip:
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        release_on_disassociation: yes
        in_vpc: yes
        public_ip: "{{ item.public_ip }}"
        state: absent
      with_items: "{{ eip_info.addresses | default([]) }}"
      when: vpc_id is defined and eip_info.addresses is defined and item.domain == "vpc" and (item.vpc_id | default('')) == vpc_id
      ignore_errors: yes
      
    # Check for network interfaces and delete them
    - name: Get network interfaces
      amazon.aws.ec2_eni_info:
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        filters:
          vpc-id: "{{ vpc_id }}"
      register: eni_info
      when: vpc_id is defined
      
    - name: Delete network interfaces
      amazon.aws.ec2_eni:
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        eni_id: "{{ item.id }}"
        state: absent
        force_detach: yes
      with_items: "{{ eni_info.network_interfaces | default([]) }}"
      ignore_errors: yes
      when: vpc_id is defined and eni_info.network_interfaces is defined
      
    # Now try to delete security groups
    - name: Delete security group
      amazon.aws.ec2_group:
        name: mariadb-sg
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        vpc_id: "{{ vpc_id }}"
        state: absent
      ignore_errors: yes
      when: vpc_id is defined
      
    - name: Get route table information
      amazon.aws.ec2_vpc_route_table_info:
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        filters:
          "tag:Name": mariadb-route-table
          "vpc-id": "{{ vpc_id }}"
      register: route_table_info
      when: vpc_id is defined
      
    - name: Delete route table
      amazon.aws.ec2_vpc_route_table:
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        vpc_id: "{{ vpc_id }}"
        route_table_id: "{{ item.id }}"
        state: absent
      with_items: "{{ route_table_info.route_tables | default([]) }}"
      ignore_errors: yes
      when: vpc_id is defined and route_table_info.route_tables is defined and route_table_info.route_tables | length > 0
      
    - name: Get Internet Gateway information
      amazon.aws.ec2_vpc_igw_info:
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        filters:
          "attachment.vpc-id": "{{ vpc_id }}"
      register: igw_info
      when: vpc_id is defined
      
    - name: Delete Internet Gateway
      amazon.aws.ec2_vpc_igw:
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        vpc_id: "{{ vpc_id }}"
        state: absent
      ignore_errors: yes
      when: vpc_id is defined and igw_info.internet_gateways is defined and igw_info.internet_gateways | length > 0
      
    - name: Get subnet information
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        filters:
          vpc-id: "{{ vpc_id }}"
      register: subnet_info
      when: vpc_id is defined
      
    - name: Delete subnet
      amazon.aws.ec2_vpc_subnet:
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        vpc_id: "{{ vpc_id }}"
        cidr: "{{ item.cidr_block }}"
        state: absent
      with_items: "{{ subnet_info.subnets | default([]) }}"
      ignore_errors: yes
      when: vpc_id is defined and subnet_info.subnets is defined
      
    - name: Delete VPC
      amazon.aws.ec2_vpc_net:
        vpc_id: "{{ vpc_id }}"
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        state: absent
      ignore_errors: yes
      when: vpc_id is defined
      
    - name: Delete EC2 key pair
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        state: absent
      ignore_errors: yes
      
    - name: Remove local private key file
      file:
        path: "~/.ssh/{{ key_name }}.pem"
        state: absent
      ignore_errors: yes
      
    - name: Remove local public key file
      file:
        path: "~/.ssh/{{ key_name }}.pub"
        state: absent
      ignore_errors: yes
      
    - name: Remove local backup key files
      file:
        path: "{{ item }}"
        state: absent
      with_items:
        - "~/.ssh/{{ key_name }}.pem.bak"
        - "~/.ssh/{{ key_name }}.pub.bak"
      ignore_errors: yes
      
    - name: Cleanup status
      debug:
        msg: "AWS infrastructure destruction completed. Please verify in AWS console that all resources were properly removed."