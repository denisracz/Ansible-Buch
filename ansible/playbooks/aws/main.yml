- name: AWS Infrastruktur bereitstellen
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    region: eu-central-1
    instance_type: t3.micro
    ami_id: ami-0699c78c4486e5f1e   # Ubuntu 22.04 (Frankfurt)
    vpc_cidr_block: 10.0.0.0/16
    subnet_cidr_block: 10.0.1.0/24
    key_name: "mariadb-key"
    key_path: "~/.ssh/{{ key_name }}.pem"
    security_group_ports:
      - "22"
      - "3306"
    aws_access_key: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      # Gekürzt
    aws_secret_key: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      # Gekürzt

  tasks:
    - name: Erstellen des EC2-Key-Pair
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        force: yes
      register: key_result

    - name: Key speichern
      copy:
        content: "{{ key_result.key.private_key }}"
        dest: "{{ key_path }}"
        mode: '0600'
      when: key_result.key.private_key is defined
      register: private_key_saved

    - name: Public Key löschen (wenn neu generiert)
      file:
        path: "{{ key_path }}.pub"
        state: absent
      when: private_key_saved is changed

    - name: Public Key generieren
      shell: "ssh-keygen -y -f {{ key_path }} > {{ key_path }}.pub"
      when: key_result.key.private_key is defined or key_file_stat.stat.exists
      register: public_key_extracted

    - name: Public Key lesen
      slurp:
        src: "{{ key_path }}.pub"
      register: public_key_b64
      ignore_errors: yes

    - name: Public key fact setzen
      set_fact:
        public_key: "{{ public_key_b64.content | b64decode | trim }}"
      when: public_key_b64 is defined and public_key_b64.content is defined

    - name: Get EC2 instance info
      amazon.aws.ec2_instance_info:
        region: eu-central-1
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"

    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        name: mariadb-vpc
        cidr_block: "{{ vpc_cidr_block }}"
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
      register: my_vpc

    - name: Create subnet
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ my_vpc.vpc.id }}"
        cidr: "{{ subnet_cidr_block }}"
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        map_public: yes
      register: my_subnet

    - name: Create Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ my_vpc.vpc.id }}"
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        state: present
      register: igw

    - name: Create route table
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ my_vpc.vpc.id }}"
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        subnets:
          - "{{ my_subnet.subnet.id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igw.gateway_id }}"
        tags:
          Name: "mariadb-route-table"
          Project: "MariaDB"
        purge_subnets: false
        purge_routes: false
        purge_tags: false
      register: route_table

    - name: Create security group
      amazon.aws.ec2_group:
        name: mariadb-sg
        description: "Allow SSH + MariaDB"
        vpc_id: "{{ my_vpc.vpc.id }}"
        region: "{{ region }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        rules:
          - proto: tcp
            ports: "{{ security_group_ports }}"
            cidr_ip: 0.0.0.0/0
      register: my_sg

    - name: Launch EC2 instance
      amazon.aws.ec2_instance:
        name: mariadb-instance
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        region: "{{ region }}"
        image_id: "{{ ami_id }}"
        subnet_id: "{{ my_subnet.subnet.id }}"
        security_group: "{{ my_sg.group_id }}"
        aws_access_key_id: "{{ aws_access_key }}"
        aws_secret_access_key: "{{ aws_secret_key }}"
        network:
          assign_public_ip: true
        wait: true
        user_data: |
          #!/bin/bash
          mkdir -p /home/ubuntu/.ssh
          echo "{{ public_key }}" >> /home/ubuntu/.ssh/authorized_keys
          chmod 700 /home/ubuntu/.ssh
          chmod 600 /home/ubuntu/.ssh/authorized_keys
          chown -R ubuntu:ubuntu /home/ubuntu/.ssh
        tags:
          Role: mariadb
      register: ec2
      when: public_key is defined

    - name: Connection Infos anzeigen
      debug:
        msg: ssh -i {{ key_path }} ubuntu@{{ ec2.instances[0].public_dns_name }}
      when: ec2.instances is defined
